{% from 'bootstrap5/form.html' import render_form %}
{% include 'header.html' %}

<div id="main">
    <section id="portfolio" class="two">
        <div class="container">
            <div class="h2">Sign In</div>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                    <p style="color:red">{{ msg }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            {{ render_form(form) }}
        </div>
    </section>
</div>

{% include 'footer.html' %}
